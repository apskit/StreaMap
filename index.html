<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>StreaMap 0.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="add-stream-form">
        <h3>Add stream source</h3>

        <button class="map-managment">Import</button>
        <button class="map-managment">Export</button>
        <button class="map-managment">Clear map</button>

        <div class="form-group">
            <label>Title:</label>
            <input type="text" id="stream-name" placeholder="Live Camera">
        </div>
        <div class="form-group">
            <label>Latitude:</label>
            <input type="number" id="stream-lat" placeholder="Click on map..." min=-90 max=90 step=0.000001 required>
        </div>
        <div class="form-group">
            <label>Longitude:</label>
            <input type="number" id="stream-lng" placeholder="Click on map..." min=-180 max=180 step=0.000001 required>
        </div>
        <div class="form-group">
            <label>Stream adress:</label>
            <input type="url" id="stream-url" placeholder="Stream URL" required>
        </div>
        <button type="submit">Add Point</button>
    </form>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="app.js"></script>
</body>
</html>
